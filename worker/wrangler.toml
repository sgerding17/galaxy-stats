name = "galaxy-live"
main = "worker.js"
compatibility_date = "2026-01-01"

# Create the namespace once with:
#   npx wrangler kv namespace create LIVE
# then paste the id it prints here.
[[kv_namespaces]]
binding = "LIVE"
id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"

# The write secret is NOT in this file. Set it with:
#   npx wrangler secret put WRITE_KEY
