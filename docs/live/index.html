<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e57a6">
  <title>Galaxy Live</title>
  <link rel="icon" href="../logger/icon-192.png">
  <link rel="stylesheet" href="live.css">
</head>
<body>

<div class="shell">
  <header class="hero">
    <div>
      <h1>Galaxy <span class="pill" id="pill" hidden>LIVE</span></h1>
      <p class="sub" id="matchup">Waiting for a game…</p>
    </div>
    <a class="back" href="../">Season stats</a>
  </header>

  <div class="notice" id="notice" hidden></div>

  <section class="scoreboard" id="scoreboard" hidden>
    <div class="side" id="side-gal">
      <span class="side-name">GALAXY</span>
      <span class="side-score" id="score-gal">0</span>
    </div>
    <div class="middle">
      <span class="clock" id="clock">20:00</span>
      <span class="period" id="period">1st half</span>
    </div>
    <div class="side" id="side-opp">
      <span class="side-name" id="opp-name">OPPONENT</span>
      <span class="side-score" id="score-opp">0</span>
    </div>
  </section>

  <section class="card" id="box-card" hidden>
    <h2>Box score</h2>
    <div class="table-scroll"><table class="box" id="box-score"></table></div>
    <p class="foot" id="foot"></p>
  </section>

  <section class="card setup" id="setup" hidden>
    <h2>Which game?</h2>
    <p>This page needs the address of the relay the scorekeeper is posting to.</p>
    <label>Relay URL
      <input type="url" id="setup-endpoint" placeholder="https://galaxy-live.example.workers.dev"
             autocapitalize="off" autocorrect="off" spellcheck="false">
    </label>
    <button type="button" id="setup-save">Watch this game</button>
    <p class="hint">It is remembered on this device. Viewing needs no password.</p>
  </section>
</div>

<script src="config.js"></script>
<script src="../logger/logstats.js"></script>
<script src="live.js"></script>
</body>
</html>
